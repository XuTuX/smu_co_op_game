<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff5db">
  <title>버스 주차</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="parking-page">
  <div class="page-shell">
    <header class="site-header">
      <div class="brand-lockup" aria-label="Bus Co-op Club">
        <div class="brand-mark" aria-hidden="true">B</div>
        <h1>버스 주차</h1>
      </div>

      <div class="header-actions">
        <div id="esp32-badge" class="status-badge local">
          <span class="status-dot"></span>
          <span id="esp32-status-text">PC</span>
        </div>
        <button id="sound-toggle-btn" class="round-button" type="button" title="소리 켜기/끄기" aria-label="소리 켜기/끄기">
          <span id="sound-icon">🔊</span>
        </button>
      </div>
    </header>

    <nav class="mode-switch" aria-label="게임 선택">
      <a class="mode-link active" href="index.html"><span>01</span> 버스 주차</a>
      <a class="mode-link" href="traffic.html"><span>02</span> 장애물 피하기</a>
      <a class="mode-link" href="jump-rope.html"><span>03</span> 단체 줄넘기</a>
      <a class="mode-link" href="beat-jump.html"><span>04</span> 타이밍 점프</a>
      <a class="mode-link" href="button-test.html"><span>05</span> 버튼 4개 연습</a>
    </nav>

    <main class="game-card parking-card">
      <section class="stats-row parking-stats" aria-label="게임 상태">
        <div class="stat-block stat-score">
          <span class="clean-stat-title">점수</span>
          <strong id="score-value">0</strong>
        </div>
        <div class="stat-block stat-round">
          <span class="clean-stat-title">라운드</span>
          <strong id="round-value">1</strong>
        </div>
        <div class="stat-block stat-lives">
          <span class="clean-stat-title">목숨</span>
          <strong id="lives-value" aria-label="목숨 3개">♥ 3</strong>
        </div>
        <div class="stat-block stat-attempt-time">
          <span class="clean-stat-title">남은 시간</span>
          <strong id="attempt-time-value">40</strong>
        </div>
      </section>

      <section class="canvas-frame parking-frame" aria-label="버스 주차 게임 화면">
        <canvas id="gameCanvas"></canvas>

        <div id="steering-hud" class="steering-hud" data-direction="center" aria-live="polite">
          <div class="steering-heading">
            <strong id="steering-direction">중앙</strong>
          </div>
          <div class="steering-wheel-panel" aria-hidden="true">
            <div id="steering-wheel" class="steering-wheel">
              <i class="steering-wheel-crossbar"></i>
              <i class="steering-wheel-column"></i>
              <i class="steering-wheel-hub"></i>
            </div>
          </div>
          <div class="steering-amount"><strong id="steering-value">0%</strong></div>
        </div>

        <div class="canvas-controls" aria-label="게임 화면 조작 패드">
          <div class="canvas-control-group">
            <button class="canvas-control p3" type="button" data-action="left" aria-label="게임 화면 좌회전 버튼">
              <span aria-hidden="true">←</span>
            </button>
            <button class="canvas-control p4" type="button" data-action="right" aria-label="게임 화면 우회전 버튼">
              <span aria-hidden="true">→</span>
            </button>
          </div>
          <div class="canvas-control-group">
            <button class="canvas-control p1" type="button" data-action="forward" aria-label="게임 화면 전진 버튼">
              <span aria-hidden="true">↑</span>
            </button>
            <button class="canvas-control p2" type="button" data-action="backward" aria-label="게임 화면 후진 버튼">
              <span aria-hidden="true">↓</span>
            </button>
          </div>
        </div>

        <div id="success-banner" class="success-banner hidden">주차 완료</div>

        <div id="countdown-overlay" class="overlay countdown-overlay hidden">
          <div id="countdown-text" class="countdown-number">3</div>
        </div>

        <div id="stage-transition" class="overlay stage-transition hidden" aria-live="assertive">
          <div class="stage-transition-card">
            <span id="stage-transition-kicker">주차 완료</span>
            <strong id="stage-transition-label">ROUND 2</strong>
            <em id="stage-transition-name">다음 주차 시작</em>
          </div>
        </div>

        <div id="start-modal" class="overlay modal-overlay ready-check-modal">
          <div class="modal-card">
            <h2 class="modal-title">버스 주차</h2>
            <p class="modal-subtitle">버튼을 눌러 준비하세요. 목숨 3개, 주차 시도마다 40초가 주어집니다.</p>

            <div class="role-grid">
              <div class="role-card role-p1" data-ready-action="forward"><span class="role-badge">P1</span><strong>전진</strong><kbd>W / ↑</kbd><button class="ready-tap" type="button" data-action="forward">준비</button></div>
              <div class="role-card role-p2" data-ready-action="backward"><span class="role-badge">P2</span><strong>후진</strong><kbd>S / ↓</kbd><button class="ready-tap" type="button" data-action="backward">준비</button></div>
              <div class="role-card role-p3" data-ready-action="left"><span class="role-badge">P3</span><strong>좌회전</strong><kbd>A / ←</kbd><button class="ready-tap" type="button" data-action="left">준비</button></div>
              <div class="role-card role-p4" data-ready-action="right"><span class="role-badge">P4</span><strong>우회전</strong><kbd>D / →</kbd><button class="ready-tap" type="button" data-action="right">준비</button></div>
            </div>

            <div id="parking-ready-progress" class="ready-progress" aria-live="polite">0 / 4</div>
          </div>
        </div>

        <div id="gameover-modal" class="overlay modal-overlay hidden">
          <div class="modal-card gameover-card">
            <h2 id="final-result-title" class="modal-title">게임 종료</h2>
            <div class="score-summary">
              <div class="summary-box"><span class="summary-label">점수</span><strong id="final-score">0</strong></div>
              <div class="summary-box"><span class="summary-label">주차</span><strong id="final-park-count">0</strong></div>
              <div class="summary-box"><span class="summary-label">라운드</span><strong id="final-round">1</strong></div>
            </div>
            <button id="restart-btn" class="btn btn-primary btn-large game-restart" type="button">다시하기</button>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/map.js"></script>
  <script src="js/collision.js"></script>
  <script src="js/parking.js"></script>
  <script src="js/bus.js"></script>
  <script src="js/input.js"></script>
  <script src="js/network.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
