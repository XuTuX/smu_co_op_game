<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8b5cf6">
  <title>단체 줄넘기</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="jump-rope.css">
</head>
<body class="rope-page">
  <div class="page-shell">
    <header class="site-header">
      <div class="brand-lockup" aria-label="Bus Co-op Club">
        <div class="brand-mark rope-brand" aria-hidden="true">J</div>
        <h1>단체 줄넘기</h1>
      </div>
      <div class="header-actions">
        <div id="rope-hardware-badge" class="status-badge local">
          <span class="status-dot"></span>
          <span id="rope-hardware-text">PC</span>
        </div>
        <button id="rope-sound-btn" class="round-button" type="button" title="소리 켜기/끄기" aria-label="소리 켜기/끄기">🔊</button>
      </div>
    </header>

    <nav class="mode-switch" aria-label="게임 선택">
      <a class="mode-link" href="index.html"><span>01</span> 버스 주차</a>
      <a class="mode-link" href="traffic.html"><span>02</span> 장애물 피하기</a>
      <a class="mode-link active rope-active" href="jump-rope.html"><span>03</span> 단체 줄넘기</a>
      <a class="mode-link" href="beat-jump.html"><span>04</span> 타이밍 점프</a>
      <a class="mode-link" href="button-test.html"><span>05</span> 버튼 4개 연습</a>
    </nav>

    <main class="game-card rope-card">
      <section class="stats-row rope-stats" aria-label="단체 줄넘기 게임 상태">
        <div class="stat-block rope-score-card">
          <span class="clean-stat-title">점수</span>
          <strong id="rope-score">0</strong>
        </div>
        <div class="stat-block rope-time-card">
          <span class="clean-stat-title">목숨</span>
          <strong id="rope-time">♥♥♥</strong>
        </div>
      </section>

      <section class="canvas-frame rope-frame" aria-label="네 캐릭터가 각자 점프하는 단체 줄넘기 게임 화면">
        <canvas id="ropeCanvas"></canvas>
        <div id="rope-callout" class="rope-callout hidden" aria-live="assertive"></div>

        <div class="rope-player-controls" aria-label="단체 줄넘기 조작 버튼">
          <button class="rope-player-button p1" type="button" data-action="forward" aria-label="P1 점프"><strong>W</strong></button>
          <button class="rope-player-button p2" type="button" data-action="backward" aria-label="P2 점프"><strong>S</strong></button>
          <button class="rope-player-button p3" type="button" data-action="left" aria-label="P3 점프"><strong>A</strong></button>
          <button class="rope-player-button p4" type="button" data-action="right" aria-label="P4 점프"><strong>D</strong></button>
        </div>

        <div id="rope-countdown" class="overlay countdown-overlay hidden">
          <div id="rope-countdown-text" class="countdown-number">3</div>
        </div>

        <div id="rope-start-modal" class="overlay modal-overlay ready-check-modal">
          <div class="modal-card rope-modal">
            <h2 class="modal-title">단체 줄넘기</h2>
            <p class="modal-subtitle">버튼을 눌러 준비하세요.</p>
            <div class="role-grid">
              <div class="role-card role-p1" data-ready-action="forward"><span class="role-badge">P1</span><strong>점프</strong><kbd>W / ↑</kbd><button class="ready-tap" type="button" data-action="forward">준비</button></div>
              <div class="role-card role-p2" data-ready-action="backward"><span class="role-badge">P2</span><strong>점프</strong><kbd>S / ↓</kbd><button class="ready-tap" type="button" data-action="backward">준비</button></div>
              <div class="role-card role-p3" data-ready-action="left"><span class="role-badge">P3</span><strong>점프</strong><kbd>A / ←</kbd><button class="ready-tap" type="button" data-action="left">준비</button></div>
              <div class="role-card role-p4" data-ready-action="right"><span class="role-badge">P4</span><strong>점프</strong><kbd>D / →</kbd><button class="ready-tap" type="button" data-action="right">준비</button></div>
            </div>
            <div id="rope-ready-progress" class="ready-progress rope-ready-progress" aria-live="polite">0 / 4</div>
          </div>
        </div>

        <div id="rope-gameover-modal" class="overlay modal-overlay hidden">
          <div class="modal-card gameover-card">
            <h2 id="rope-gameover-message" class="modal-title">게임 종료</h2>
            <div class="score-summary rope-summary">
              <div class="summary-box"><span class="summary-label">점수</span><strong id="rope-final-score">0</strong></div>
              <div class="summary-box"><span class="summary-label">성공</span><strong id="rope-perfect-count">0</strong></div>
            </div>
            <button id="rope-restart-btn" class="btn btn-primary btn-large game-restart" type="button">다시하기</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/sound.js"></script>
  <script src="js/input.js"></script>
  <script src="js/network.js"></script>
  <script src="js/jump-rope.js"></script>
</body>
</html>
