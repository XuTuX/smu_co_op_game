<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#c6f36b">
  <title>버튼 연습</title>
  <link rel="stylesheet" href="style.css?v=20260828-4">
  <link rel="stylesheet" href="button-test.css?v=20260828-4">
</head>
<body class="button-test-page">
  <div class="page-shell">
    <header class="site-header">
      <div class="brand-lockup" aria-label="Bus Co-op Club">
        <div class="brand-mark test-brand" aria-hidden="true">4</div>
        <h1>버튼 연습</h1>
      </div>

      <div id="test-hardware-badge" class="status-badge disconnected" aria-live="polite">
        <span class="status-dot"></span>
        <span id="test-hardware-text">연결 대기</span>
      </div>
    </header>

    <nav class="mode-switch" aria-label="페이지 선택">
      <a class="mode-link" href="index.html"><span>01</span> 버스 주차</a>
      <a class="mode-link" href="traffic.html"><span>02</span> 장애물 피하기</a>
      <a class="mode-link" href="jump-rope.html"><span>03</span> 단체 줄넘기</a>
      <a class="mode-link" href="beat-jump.html"><span>04</span> 타이밍 점프</a>
      <a class="mode-link active test-active" href="button-test.html"><span>05</span> 버튼 4개 연습</a>
    </nav>

    <main class="game-card button-test-card">
      <section id="connection-panel" class="connection-panel waiting" aria-live="polite">
        <strong id="connection-title">ESP32 연결 대기</strong>
      </section>

      <section class="button-grid" aria-label="ESP32 버튼 4개 실시간 상태">
        <article class="gpio-button-card p1" data-input-action="forward">
          <header><span class="player-chip">P1</span><span class="gpio-chip">W</span></header>
          <div class="mini-button" aria-hidden="true"><span></span></div>
          <strong class="action-name">전진 / 위</strong>
          <span class="button-state">대기</span>
          <div class="card-count"><span>횟수</span><b data-press-count="forward">0</b></div>
        </article>

        <article class="gpio-button-card p2" data-input-action="backward">
          <header><span class="player-chip">P2</span><span class="gpio-chip">S</span></header>
          <div class="mini-button" aria-hidden="true"><span></span></div>
          <strong class="action-name">후진 / 아래</strong>
          <span class="button-state">대기</span>
          <div class="card-count"><span>횟수</span><b data-press-count="backward">0</b></div>
        </article>

        <article class="gpio-button-card p3" data-input-action="left">
          <header><span class="player-chip">P3</span><span class="gpio-chip">A</span></header>
          <div class="mini-button" aria-hidden="true"><span></span></div>
          <strong class="action-name">왼쪽</strong>
          <span class="button-state">대기</span>
          <div class="card-count"><span>횟수</span><b data-press-count="left">0</b></div>
        </article>

        <article class="gpio-button-card p4" data-input-action="right">
          <header><span class="player-chip">P4</span><span class="gpio-chip">D</span></header>
          <div class="mini-button" aria-hidden="true"><span></span></div>
          <strong class="action-name">오른쪽</strong>
          <span class="button-state">대기</span>
          <div class="card-count"><span>횟수</span><b data-press-count="right">0</b></div>
        </article>
      </section>
    </main>
  </div>

  <script src="js/network.js?v=20260828-4"></script>
  <script src="js/button-test.js?v=20260828-4"></script>
</body>
</html>
