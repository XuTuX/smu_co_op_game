<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff5db">
  <title>장애물 피하기</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="traffic.css">
</head>
<body class="traffic-page">
  <div class="page-shell">
    <header class="site-header">
      <div class="brand-lockup" aria-label="Bus Co-op Club">
        <div class="brand-mark traffic-brand" aria-hidden="true">B</div>
        <h1>장애물 피하기</h1>
      </div>
      <div class="header-actions">
        <div id="traffic-hardware-badge" class="status-badge local">
          <span class="status-dot"></span>
          <span id="traffic-hardware-text">PC</span>
        </div>
        <button id="traffic-sound-btn" class="round-button" type="button" title="소리 켜기/끄기" aria-label="소리 켜기/끄기">🔊</button>
      </div>
    </header>

    <nav class="mode-switch" aria-label="게임 선택">
      <a class="mode-link" href="index.html"><span>01</span> 버스 주차</a>
      <a class="mode-link active traffic-active" href="traffic.html"><span>02</span> 장애물 피하기</a>
      <a class="mode-link" href="jump-rope.html"><span>03</span> 단체 줄넘기</a>
      <a class="mode-link" href="beat-jump.html"><span>04</span> 타이밍 점프</a>
      <a class="mode-link" href="button-test.html"><span>05</span> 버튼 4개 연습</a>
    </nav>

    <main class="game-card traffic-card">
      <section class="stats-row traffic-stats" aria-label="장애물 피하기 게임 상태">
        <div class="stat-block stat-score">
          <span class="clean-stat-title">점수</span>
          <strong id="traffic-score">0</strong>
        </div>
        <div class="stat-block traffic-time-card">
          <span class="clean-stat-title">시간</span>
          <strong id="traffic-time">0</strong>
        </div>
        <div class="stat-block traffic-lives-card">
          <span class="clean-stat-title">목숨</span>
          <strong id="traffic-lives" aria-label="남은 목숨 3개">♥♥♥</strong>
        </div>
      </section>

      <section class="canvas-frame traffic-frame" aria-label="이동 박스와 레이저를 피하고 별과 생명 하트를 획득하는 게임 화면">
        <canvas id="trafficCanvas"></canvas>
        <div id="traffic-toast" class="traffic-toast hidden" aria-live="assertive"></div>

        <div class="canvas-controls" aria-label="장애물 피하기 조작 패드">
          <div class="canvas-control-group">
            <button class="canvas-control p3" type="button" data-action="left" aria-label="장애물 게임 왼쪽 버튼"><span aria-hidden="true">←</span></button>
            <button class="canvas-control p4" type="button" data-action="right" aria-label="장애물 게임 오른쪽 버튼"><span aria-hidden="true">→</span></button>
          </div>
          <div class="canvas-control-group">
            <button class="canvas-control p1" type="button" data-action="forward" aria-label="장애물 게임 위쪽 버튼"><span aria-hidden="true">↑</span></button>
            <button class="canvas-control p2" type="button" data-action="backward" aria-label="장애물 게임 아래쪽 버튼"><span aria-hidden="true">↓</span></button>
          </div>
        </div>

        <div id="traffic-countdown" class="overlay countdown-overlay hidden">
          <div id="traffic-countdown-text" class="countdown-number">3</div>
        </div>

        <div id="traffic-start-modal" class="overlay modal-overlay ready-check-modal">
          <div class="modal-card traffic-modal">
            <h2 class="modal-title">장애물 피하기</h2>
            <p class="modal-subtitle">버튼을 눌러 준비하세요.</p>
            <div class="role-grid">
              <div class="role-card role-p1" data-ready-action="forward"><span class="role-badge">P1</span><strong>위</strong><kbd>W / ↑</kbd><button class="ready-tap" type="button" data-action="forward">준비</button></div>
              <div class="role-card role-p2" data-ready-action="backward"><span class="role-badge">P2</span><strong>아래</strong><kbd>S / ↓</kbd><button class="ready-tap" type="button" data-action="backward">준비</button></div>
              <div class="role-card role-p3" data-ready-action="left"><span class="role-badge">P3</span><strong>왼쪽</strong><kbd>A / ←</kbd><button class="ready-tap" type="button" data-action="left">준비</button></div>
              <div class="role-card role-p4" data-ready-action="right"><span class="role-badge">P4</span><strong>오른쪽</strong><kbd>D / →</kbd><button class="ready-tap" type="button" data-action="right">준비</button></div>
            </div>
            <div id="traffic-ready-progress" class="ready-progress traffic-ready-progress" aria-live="polite">0 / 4</div>
          </div>
        </div>

        <div id="traffic-gameover-modal" class="overlay modal-overlay hidden">
          <div class="modal-card gameover-card">
            <h2 id="traffic-gameover-message" class="modal-title">게임 종료</h2>
            <div class="score-summary">
              <div class="summary-box"><span class="summary-label">점수</span><strong id="traffic-final-score">0</strong></div>
            </div>
            <button id="traffic-restart-btn" class="btn btn-primary btn-large game-restart" type="button">다시하기</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/input.js"></script>
  <script src="js/network.js"></script>
  <script src="js/box-character.js"></script>
  <script src="js/traffic-game.js"></script>
</body>
</html>
