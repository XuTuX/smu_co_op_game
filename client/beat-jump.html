<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06b6d4">
  <title>타이밍 점프</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="beat-jump.css">
</head>
<body class="beat-page">
  <div class="page-shell">
    <header class="site-header">
      <div class="brand-lockup" aria-label="Bus Co-op Club">
        <div class="brand-mark beat-brand" aria-hidden="true">T</div>
        <h1>타이밍 점프</h1>
      </div>
      <div class="header-actions">
        <div id="beat-hardware-badge" class="status-badge local"><span class="status-dot"></span><span id="beat-hardware-text">PC</span></div>
        <button id="beat-sound-btn" class="round-button" type="button" title="소리 켜기/끄기" aria-label="소리 켜기/끄기">🔊</button>
      </div>
    </header>

    <nav class="mode-switch" aria-label="게임 선택">
      <a class="mode-link" href="index.html"><span>01</span> 버스 주차</a>
      <a class="mode-link" href="traffic.html"><span>02</span> 장애물 피하기</a>
      <a class="mode-link" href="jump-rope.html"><span>03</span> 단체 줄넘기</a>
      <a class="mode-link active beat-active" href="beat-jump.html"><span>04</span> 타이밍 점프</a>
      <a class="mode-link" href="button-test.html"><span>05</span> 버튼 4개 연습</a>
    </nav>

    <main class="game-card beat-card">
      <section class="stats-row beat-stats" aria-label="타이밍 점프 게임 상태">
        <div class="stat-block beat-score-card"><span class="beat-stat-title">점수</span><strong id="beat-score">0</strong></div>
        <div class="stat-block beat-time-card"><span class="beat-stat-title">목숨</span><strong id="beat-time">♥♥♥</strong></div>
      </section>

      <section class="canvas-frame beat-frame" aria-label="좌우에서 오는 장애물을 네 캐릭터가 각자 피하는 타이밍 점프 게임 화면">
        <canvas id="beatCanvas"></canvas>
        <div id="beat-direction" class="beat-direction hidden" data-direction="left"><span id="beat-direction-arrow">→</span><strong id="beat-direction-text">×1</strong></div>

        <div class="beat-player-controls" aria-label="타이밍 점프 조작 버튼">
          <button class="beat-player-button p1" type="button" data-action="forward" aria-label="P1 점프"><strong>W</strong></button>
          <button class="beat-player-button p2" type="button" data-action="backward" aria-label="P2 점프"><strong>S</strong></button>
          <button class="beat-player-button p3" type="button" data-action="left" aria-label="P3 점프"><strong>A</strong></button>
          <button class="beat-player-button p4" type="button" data-action="right" aria-label="P4 점프"><strong>D</strong></button>
        </div>

        <div id="beat-countdown" class="overlay countdown-overlay hidden"><div id="beat-countdown-text" class="countdown-number">3</div></div>
        <div id="beat-start-modal" class="overlay modal-overlay ready-check-modal">
          <div class="modal-card beat-modal">
            <h2 class="modal-title">타이밍 점프</h2>
            <p class="modal-subtitle">버튼을 눌러 준비하세요.</p>
            <div class="role-grid">
              <div class="role-card role-p1" data-ready-action="forward"><span class="role-badge">P1</span><strong>점프</strong><kbd>W / ↑</kbd><button class="ready-tap" type="button" data-action="forward">준비</button></div>
              <div class="role-card role-p2" data-ready-action="backward"><span class="role-badge">P2</span><strong>점프</strong><kbd>S / ↓</kbd><button class="ready-tap" type="button" data-action="backward">준비</button></div>
              <div class="role-card role-p3" data-ready-action="left"><span class="role-badge">P3</span><strong>점프</strong><kbd>A / ←</kbd><button class="ready-tap" type="button" data-action="left">준비</button></div>
              <div class="role-card role-p4" data-ready-action="right"><span class="role-badge">P4</span><strong>점프</strong><kbd>D / →</kbd><button class="ready-tap" type="button" data-action="right">준비</button></div>
            </div>
            <div id="beat-ready-progress" class="ready-progress beat-ready-progress" aria-live="polite">0 / 4</div>
          </div>
        </div>

        <div id="beat-gameover-modal" class="overlay modal-overlay hidden">
          <div class="modal-card gameover-card">
            <h2 id="beat-gameover-message" class="modal-title">게임 종료</h2>
            <div class="score-summary beat-summary"><div class="summary-box"><span class="summary-label">점수</span><strong id="beat-final-score">0</strong></div><div class="summary-box"><span class="summary-label">웨이브</span><strong id="beat-best-combo">0</strong></div></div>
            <button id="beat-restart-btn" class="btn btn-primary btn-large game-restart" type="button">다시하기</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/sound.js"></script>
  <script src="js/input.js"></script>
  <script src="js/network.js"></script>
  <script src="js/box-character.js"></script>
  <script src="js/beat-jump.js"></script>
</body>
</html>
