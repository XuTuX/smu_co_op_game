; PlatformIO Project Configuration File for ESP32 4-Button Bus Controller

[platformio]
data_dir = client
 
[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
build_src_filter = +<main.cpp> -<hub/> -<controller/>
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = app3M_spiffs9M_fact512k_16MB.csv
board_build.filesystem = littlefs
lib_deps = 
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<main.cpp> -<hub/> -<controller/>
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
lib_deps = 
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4

; ESP32 A: Wi-Fi AP + web/LittleFS + WebSocket + UDP channel hub
[env:esp32-s3-hub]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
build_src_filter = -<*> +<hub/main.cpp>
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = app3M_spiffs9M_fact512k_16MB.csv
board_build.filesystem = littlefs
lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4

; ESP32 B: 12-button Wi-Fi/UDP controller
[env:esp32-s3-controller]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
build_src_filter = -<*> +<controller/main.cpp>
monitor_speed = 115200
upload_speed = 460800
